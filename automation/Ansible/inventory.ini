[routers]
R1 ansible_host=10.0.0.12

[routers:vars]
ansible_user=cisco
ansible_password=cisco
ansible_network_os=cisco.ios.ios
ansible_connection=network_cli
ansible_ssh_type=paramiko
ansible_ssh_common_args='-o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa'
