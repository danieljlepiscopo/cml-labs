    configuration:
      - name: iosxe_config.txt
        content: |-
          # this is a shell script which will be sourced at boot
          hostname SVR1
          # configurable user account
          USERNAME=cisco
          PASSWORD=cisco
          ifconfig eth0 15.0.0.1 netmask 255.255.255.252
          ifconfig eth0 add fd00:15::1/64
          route add default gw 15.0.0.2 eth0
          ip -6 route add default via fd00:15::2
          # no password for tc user by default
          TC_PASSWORD=
